{{ define "main" }}

<article class="page cv-page">

    <h1>{{ .Title }}</h1>

    {{ with .Params.summary }}
        <p class="project-summary">{{ . }}</p>
    {{ end }}

    {{ partial "metadata.html" . }}

    {{ with .Params.pdf_url }}
        <p class="project-link">
            <a href="{{ "/cv/cv.pdf" | relURL }}">Download CV (PDF)</a>
        </p>
    {{ end }}

    {{ .Content }}

</article>

{{ end }}
